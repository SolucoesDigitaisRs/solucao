}

    /* Card do Chalé (também clicável para abrir o WhatsApp perguntando sobre o modelo) */

    .card img {

    }

<audio id="audioBoasVindas" src="Boas_Vindas.mp3" preload="auto"></audio>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var audio = document.getElementById("audioBoasVindas");

    // Verifica se é a primeira vez que ele abre a página nesta sessão de navegação
    if (!sessionStorage.getItem("audioTocado")) {
      
      // Função para tentar tocar o áudio no primeiro clique/toque na tela
      function tocarAudio() {
        audio.play().then(function() {
          // Marca que o áudio já foi executado nesta sessão
          sessionStorage.setItem("audioTocado", "true");
          
          // Remove os ouvintes de evento para não tentar tocar novamente
          document.removeEventListener("click", tocarAudio);
          document.removeEventListener("touchstart", tocarAudio);
        }).catch(function(error) {
          console.log("Autoplay bloqueado pelo navegador. Aguardando interação.");
        });
      }

      // Adiciona o gatilho para o primeiro toque do usuário no celular
      document.addEventListener("click", tocarAudio);
      document.addEventListener("touchstart", tocarAudio);
    }
  });
</script>
